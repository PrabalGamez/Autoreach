<!doctype html>
<html><head><meta charset="utf-8"><title>Autoreach banner</title>
<style>

@font-face { font-family: 'Inter Tight'; src: url('../../node_modules/@fontsource/inter-tight/files/inter-tight-latin-400-normal.woff2') format('woff2'); font-weight: 400; }
@font-face { font-family: 'Inter Tight'; src: url('../../node_modules/@fontsource/inter-tight/files/inter-tight-latin-600-normal.woff2') format('woff2'); font-weight: 600; }
:root { --ground:#0c1d13; --forest:#142a1e; --line:#ffffff17; --cream:#ecebe1; --lime:#9fe870; --ember:#f26522; }
html,body { margin:0; }
body { width:1600px; height:640px; background:var(--ground); color:var(--cream); font-family:'Inter Tight',sans-serif; overflow:hidden; position:relative; }
body.light { --ground:#ebe8e3; --line:#d3cec7; --cream:#141a16; }
svg.traces { position:absolute; inset:0; width:100%; height:100%; }
.wrap { position:absolute; left:120px; top:118px; right:120px; }
.mark { width:84px; height:84px; border-radius:18px; background:#0c1d13; display:grid; place-items:center; box-shadow:0 0 0 2px #ffffff14; }
body.light .mark { box-shadow:none; }
h1 { font-family:'Bricolage',sans-serif; font-weight:800; font-size:150px; letter-spacing:-0.055em; line-height:.9; margin:40px 0 0; }
h1 span { color:var(--lime); }
body.light h1 span { color:#2f5640; }
p { font-size:34px; margin:28px 0 0; letter-spacing:-0.01em; opacity:.82; max-width:820px; line-height:1.25; text-wrap:balance; }
.card { position:absolute; right:110px; top:168px; width:440px; background:var(--forest); border-radius:18px; padding:28px 30px; box-shadow:0 40px 70px -40px #000c, inset 0 1px 0 #ffffff10; color:#ecebe1; }
.card .k { font-size:17px; opacity:.65; }
.card .t { font-family:'Bricolage',sans-serif; font-weight:700; font-size:34px; letter-spacing:-0.03em; margin-top:6px; }
.row { display:flex; gap:10px; margin-top:22px; }
.btn { height:46px; border-radius:8px; display:inline-grid; place-items:center; padding:0 18px; font-weight:600; font-size:18px; }
.lime { background:var(--lime); color:#0c1d13; }
.ghost { background:#ffffff14; }
.offer { margin-top:22px; display:flex; gap:12px; align-items:center; background:#ffffff0d; border-radius:10px; padding:14px 16px; font-size:18px; }
.dot { width:30px; height:30px; border-radius:7px; background:var(--ember); display:grid; place-items:center; }
</style></head>
<body class="__THEME__">
<svg class="traces" viewBox="0 0 1600 640" preserveAspectRatio="none" fill="none" stroke="var(--line)" stroke-width="1.5">
  <path d="M0 70 H260 Q280 70 280 90 V150"/><path d="M0 560 H180 Q200 560 200 540 V470"/>
  <path d="M1600 600 H1380 Q1360 600 1360 580 V520"/><path d="M980 0 V40 Q980 60 1000 60 H1140"/>
  <path d="M640 640 V600 Q640 580 660 580 H860"/>
</svg>
<div class="wrap">
  <div class="mark"><svg width="46" height="46" viewBox="0 0 20 20" fill="none" stroke="#9fe870" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 15 15 5M8 5h7v7"/></svg></div>
  <h1>Autoreach<span>.</span></h1>
  <p>Pitch anyone, personally. Claude researches and writes; you press Send.</p>
</div>
<div class="card">
  <div class="k">Draft ready · Northwind Studio</div>
  <div class="t">One email, written for them.</div>
  <div class="row"><span class="btn lime">Open in Gmail →</span><span class="btn ghost">Skip</span></div>
  <div class="offer"><span class="dot"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4"><path d="M12 3c1 3 4 4.5 4 8.5A4 4 0 0 1 8 11.5C8 9 10 8 10 6"/><path d="M12 21a6 6 0 0 0 6-6c0-2-1-3.5-2-4.5"/></svg></span>Offer detected in a reply</div>
</div>
</body></html>
